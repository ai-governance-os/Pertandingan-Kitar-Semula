<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>宠物乐园 v2 · 卡通风 · Eco Pet Park</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  html,body{width:100%;height:100%;overflow:hidden;background:#CDEBFF;
    font-family:"Nunito","Microsoft YaHei",system-ui,sans-serif}
  #scene{position:fixed;inset:0}
  #tags{position:fixed;inset:0;pointer-events:none;overflow:hidden}
  .tag{position:absolute;transform:translate(-50%,-100%);display:flex;flex-direction:column;
    align-items:center;gap:1px;white-space:nowrap}
  .tag-name{background:rgba(255,255,255,.95);color:#3B2E1E;border:2.5px solid #3B2E1E;
    border-radius:999px;padding:1px 10px;font-size:12.5px;font-weight:800;line-height:1.35;
    box-shadow:0 2px 0 #3B2E1E}
  .tag-name .stage{opacity:.5;font-weight:700;font-size:10px;margin-left:4px}
  .tag-mood{font-size:15px;line-height:1;filter:drop-shadow(0 1px 1px rgba(0,0,0,.3))}
  .tag.legend .tag-name{background:linear-gradient(180deg,#FFF6D6,#FFE49B);border-color:#8A5A12}
  .tag.starving .tag-name{background:#FFDCD2;border-color:#A8321A;color:#6B2410}
  .hud{position:fixed;left:12px;top:12px}
  .hud-card{background:rgba(255,252,244,.95);border:3px solid #3B2E1E;border-radius:18px;
    padding:10px 14px;box-shadow:0 4px 0 #3B2E1E}
  .hud-title{font-size:15px;font-weight:900;color:#3B2E1E}
  .hud-sub{font-size:11px;color:#6B5A45;margin-top:2px}
  .controls{position:fixed;right:12px;top:12px;display:flex;gap:6px}
  .ctrl-btn{background:rgba(255,252,244,.95);border:3px solid #3B2E1E;border-radius:14px;
    padding:7px 12px;font-size:13px;font-weight:800;color:#3B2E1E;cursor:pointer;
    box-shadow:0 3px 0 #3B2E1E;font-family:inherit}
  .ctrl-btn.active{background:linear-gradient(180deg,#8BE06B,#4CAF50);color:#fff}
  .hint{position:fixed;left:50%;bottom:14px;transform:translateX(-50%);background:rgba(59,46,30,.8);
    color:#fff;font-size:12px;font-weight:700;padding:7px 14px;border-radius:999px}
</style>
</head>
<body>
<canvas id="scene"></canvas>
<div id="tags"></div>
<div class="hud"><div class="hud-card">
  <div class="hud-title">🐾 宠物乐园 v2 · 卡通风</div>
  <div class="hud-sub">描边卡通渲染 · 花园场景 · 真实星星数据</div>
</div></div>
<div class="controls">
  <button class="ctrl-btn active" id="btn-rotate">🎥 自动转</button>
</div>
<div class="hint">🖱️ 拖动转视角 · 滚轮缩放</div>

<script src="https://unpkg.com/three@0.128.0/build/three.min.js"></script>
<script>
const STAGES=[{min:0,zh:"蛋"},{min:25,zh:"幼体"},{min:70,zh:"少年"},{min:150,zh:"成年"},{min:300,zh:"传说"}];
const ROSTER=[
 ["郑静娥",244,"lion",1],["刘宇哲",170,"dino",1],["赵凱泽",160,"tree",4],
 ["王欣美",152,"lion",0],["刘妍彤",144,"whale",2],["李栎颖",142,"whale",1],
 ["刘丽情",127,"dragon",3],["王欣依",127,"whale",0],["陈月營",113,"tree",6],
 ["刘欣瑜",105,"whale",1],["陈晋贤",100,"lion",2],["曾昱勋",84,"dragon",16],
 ["郑祖建",64,"owl",3],["刘丽恩",61,"owl",9],["郑琳仙",60,"owl",1],
 ["李冠德",21,"dino",5],["赖萱宁",4,"tree",2],["李唆竑",0,"owl",null],["郑静儿",0,"lion",null],
];
// One curated palette for every creature keeps the park looking like a single
// illustrated set instead of six unrelated toys.
const LOOKS={
 lion:  {body:0xFFC15E,belly:0xFFE3B0,accent:0xE07A3E,ear:"round",mane:true, tail:"tuft", horn:false,wing:false},
 dragon:{body:0x6FD3B8,belly:0xCFF3E6,accent:0xF2789F,ear:"horn", mane:false,tail:"spike",horn:true, wing:true },
 dino:  {body:0x9FD86B,belly:0xE4F5C4,accent:0x5FA045,ear:"none", mane:false,tail:"spike",horn:false,wing:false},
 whale: {body:0x7FC4F5,belly:0xDCF0FF,accent:0x3E86C4,ear:"none", mane:false,tail:"fin",  horn:false,wing:false},
 owl:   {body:0xD8A87A,belly:0xF6E3CC,accent:0x8A5F3C,ear:"tuft", mane:false,tail:"none", horn:false,wing:true },
 tree:  {body:0x86CF6B,belly:0xC7EDAE,accent:0x9A6B43,ear:"leaf", mane:false,tail:"none", horn:false,wing:false},
};
const stageIdx=e=>{let i=0;STAGES.forEach((s,n)=>{if(e>=s.min)i=n});return i};
const hungerOf=d=>d===null?{k:"unhatched",i:"🥚"}:d>=14?{k:"starving",i:"😰"}:d>=7?{k:"hungry",i:"😟"}:d>=3?{k:"peckish",i:"🙂"}:{k:"full",i:"😊"};

const canvas=document.getElementById('scene');
const renderer=new THREE.WebGLRenderer({canvas,antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.shadowMap.enabled=true; renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputEncoding=THREE.sRGBEncoding;

const scene=new THREE.Scene();
const camera=new THREE.PerspectiveCamera(40,1,0.1,300);
let camAngle=0.7,camDist=34,camHeight=26,autoRotate=true;

// ── sky dome: a vertical gradient reads far friendlier than a flat colour ──
(function(){
  const c=document.createElement('canvas'); c.width=8; c.height=256;
  const g=c.getContext('2d').createLinearGradient(0,0,0,256);
  g.addColorStop(0,'#7FC6F0'); g.addColorStop(.55,'#CDEBFF'); g.addColorStop(1,'#F3F8DC');
  const ctx=c.getContext('2d'); ctx.fillStyle=g; ctx.fillRect(0,0,8,256);
  const tex=new THREE.CanvasTexture(c);
  const sky=new THREE.Mesh(new THREE.SphereGeometry(140,24,16),
    new THREE.MeshBasicMaterial({map:tex,side:THREE.BackSide,fog:false}));
  scene.add(sky);
})();
scene.fog=new THREE.Fog(0xD8EEFF,85,150);

// ── toon ramp: 3 hard steps = storybook shading, not plastic gradients ──
const ramp=(()=>{
  const d=new Uint8Array([96,96,96, 150,150,150, 205,205,205, 255,255,255]);
  const t=new THREE.DataTexture(d,4,1,THREE.RGBFormat);
  t.minFilter=t.magFilter=THREE.NearestFilter; t.needsUpdate=true; return t;
})();
const toon=(color)=>new THREE.MeshToonMaterial({color,gradientMap:ramp});
const INK=0x3B2E1E;
const outlineMat=new THREE.MeshBasicMaterial({color:INK,side:THREE.BackSide});

// Inverted-hull outline: the single cheapest trick that makes low-poly read as
// hand-drawn. Applied only to big silhouette parts to keep draw calls sane.
function outlined(geo,mat,thick=1.13){
  const g=new THREE.Group();
  const m=new THREE.Mesh(geo,mat); m.castShadow=true; g.add(m);
  const o=new THREE.Mesh(geo,outlineMat); o.scale.setScalar(thick); g.add(o);
  return g;
}
// Same API, no hull — for small parts where an outline costs a draw call but
// changes almost nothing on screen.
function plain(geo,mat){
  const g=new THREE.Group();
  const m=new THREE.Mesh(geo,mat); m.castShadow=true; g.add(m);
  return g;
}

scene.add(new THREE.HemisphereLight(0xEAF3FF,0x6FA85A,0.42));
const sun=new THREE.DirectionalLight(0xFFF2D0,0.78);
sun.position.set(18,26,12); sun.castShadow=true;
sun.shadow.mapSize.set(1024,1024);
Object.assign(sun.shadow.camera,{left:-34,right:34,top:34,bottom:-34});
sun.shadow.bias=-0.0006;
scene.add(sun);

// ── ground: gently domed so the park feels like a little world ──
const R=20;
const ground=new THREE.Mesh(new THREE.CircleGeometry(R+9,72),toon(0x5FB63F));
ground.rotation.x=-Math.PI/2; ground.receiveShadow=true;
scene.add(ground);
const grassRim=new THREE.Mesh(new THREE.RingGeometry(R+8.4,R+9,72),toon(0x3F8A2B));
grassRim.rotation.x=-Math.PI/2; grassRim.position.y=.01; scene.add(grassRim);

const path=new THREE.Mesh(new THREE.RingGeometry(10.5,13,72),toon(0xE3C98A));
path.rotation.x=-Math.PI/2; path.position.y=0.02; path.receiveShadow=true;
scene.add(path);

// pond with rim + lily pads
const pondG=new THREE.Group();
const water=new THREE.Mesh(new THREE.CircleGeometry(4,44),toon(0x45B4E8));
water.rotation.x=-Math.PI/2; pondG.add(water);
const rim=new THREE.Mesh(new THREE.TorusGeometry(4,0.34,6,28),toon(0xE7D3A1));
rim.rotation.x=-Math.PI/2; rim.castShadow=true; pondG.add(rim);
for(let i=0;i<5;i++){
  const a=i*1.3, r=1.2+i*0.45;
  const pad=new THREE.Mesh(new THREE.CircleGeometry(0.5,12),toon(0x63B84E));
  pad.rotation.x=-Math.PI/2; pad.position.set(Math.cos(a)*r,0.06,Math.sin(a)*r);
  pondG.add(pad);
  if(i%2===0){
    const fl=new THREE.Mesh(new THREE.SphereGeometry(0.17,8,8),toon(0xFF9FC4));
    fl.position.set(Math.cos(a)*r,0.2,Math.sin(a)*r); pondG.add(fl);
  }
}
pondG.position.set(-12,0.04,8); scene.add(pondG);

// ── rounded trees, bushes, rocks, flowers ──
const treeTrunkG=new THREE.CylinderGeometry(0.34,0.46,2.2,10);
const canopyG=new THREE.SphereGeometry(1.5,12,10);
const trunkMat=toon(0x8B5A2E), canopyA=toon(0x3E9B33), canopyB=toon(0x57BC45);
function makeTree(x,z,s){
  const g=new THREE.Group();
  const tr=outlined(treeTrunkG,trunkMat,1.06); tr.position.y=1.1;
  const c1=outlined(canopyG,canopyA,1.08); c1.position.set(0,2.9,0);
  const c2=outlined(canopyG,canopyB,1.05); c2.position.set(0.75,2.3,0.35); c2.scale.setScalar(0.68);
  const c3=outlined(canopyG,canopyB,1.05); c3.position.set(-0.7,2.45,-0.3); c3.scale.setScalar(0.6);
  g.add(tr,c1,c2,c3); g.position.set(x,0,z); g.scale.setScalar(s);
  scene.add(g); return g;
}
[[-16,-9,1.15],[15,-12,1],[18,5,.92],[-18,3,1.05],[9,15,1.1],[-7,-17,1],[3,-18,.95],[13,11,.85]]
  .forEach(([x,z,s])=>makeTree(x,z,s));

const bushG=new THREE.SphereGeometry(0.85,12,10);
for(let i=0;i<14;i++){
  const a=Math.random()*Math.PI*2, r=13+Math.random()*6;
  const b=plain(bushG,Math.random()>.5?canopyA:canopyB);
  b.position.set(Math.cos(a)*r,0.55,Math.sin(a)*r);
  b.scale.setScalar(0.7+Math.random()*0.6);
  scene.add(b);
}
const rockG=new THREE.IcosahedronGeometry(0.6,0);
const rockMat=toon(0xC8C3B4);
for(let i=0;i<7;i++){
  const a=Math.random()*Math.PI*2, r=8+Math.random()*10;
  const k=plain(rockG,rockMat);
  k.position.set(Math.cos(a)*r,0.3,Math.sin(a)*r);
  k.rotation.set(Math.random(),Math.random(),Math.random());
  k.scale.setScalar(0.5+Math.random()*0.5);
  scene.add(k);
}
const petalG=new THREE.CircleGeometry(0.16,6);
[0xFFB3D1,0xFFE066,0xFFFFFF,0xC9A7FF].forEach(col=>{
  const m=toon(col);
  for(let i=0;i<14;i++){
    const a=Math.random()*Math.PI*2, r=3+Math.random()*15;
    const f=new THREE.Mesh(petalG,m);
    f.rotation.x=-Math.PI/2;
    f.position.set(Math.cos(a)*r,0.03,Math.sin(a)*r);
    scene.add(f);
  }
});

// fence with rails
const postG=new THREE.BoxGeometry(0.3,1.5,0.3), railG=new THREE.BoxGeometry(0.16,0.16,2.9);
const woodMat=toon(0xDFC08A);
for(let i=0;i<28;i++){
  const a=(i/28)*Math.PI*2, x=Math.cos(a)*(R+2), z=Math.sin(a)*(R+2);
  const p=plain(postG,woodMat); p.position.set(x,0.75,z); p.lookAt(0,0.75,0); scene.add(p);
  const r1=new THREE.Mesh(railG,woodMat);
  r1.position.set(Math.cos(a+0.078)*(R+2),1.05,Math.sin(a+0.078)*(R+2));
  r1.lookAt(0,1.05,0); r1.rotateY(Math.PI/2); scene.add(r1);
  const r2=r1.clone(); r2.position.y=0.45; scene.add(r2);
}

// clouds
const cloudMat=new THREE.MeshBasicMaterial({color:0xFFFFFF,fog:false});
const clouds=[];
for(let i=0;i<7;i++){
  const g=new THREE.Group();
  for(let j=0;j<4;j++){
    const s=new THREE.Mesh(new THREE.SphereGeometry(1.6+Math.random(),10,8),cloudMat);
    s.position.set(j*1.7-2.5,Math.random()*0.6,Math.random()*0.8);
    g.add(s);
  }
  const a=Math.random()*Math.PI*2;
  g.position.set(Math.cos(a)*32,17+Math.random()*7,Math.sin(a)*32);
  g.scale.setScalar(0.9+Math.random()*0.7);
  scene.add(g); clouds.push(g);
}

// ── the creatures: big heads, big eyes, stubby bodies ──
const eyeWhiteM=new THREE.MeshBasicMaterial({color:0xFFFFFF});
const pupilM=new THREE.MeshBasicMaterial({color:0x2A2118});
const shineM=new THREE.MeshBasicMaterial({color:0xFFFFFF});
const blushM=new THREE.MeshBasicMaterial({color:0xFF9BB0,transparent:true,opacity:.75});
const ballG=new THREE.SphereGeometry(1,14,11);
const eyeG=new THREE.SphereGeometry(1,10,8);

function buildPet(spec,stage){
  const L=LOOKS[spec], g=new THREE.Group();
  const bodyM=toon(L.body), bellyM=toon(L.belly), accM=toon(L.accent);

  if(stage===0){ // egg with a crack
    const egg=outlined(ballG,toon(0xFFF6E2),1.06);
    egg.scale.set(.62,.8,.62); egg.position.y=.8; g.add(egg);
    const spot=new THREE.Mesh(ballG,accM); spot.scale.setScalar(.12);
    spot.position.set(.3,1,.42); g.add(spot);
    g.userData.idleOnly=true; return g;
  }

  // body — squat and rounded
  const body=outlined(ballG,bodyM,1.1);
  body.scale.set(.72,.62,.78); body.position.y=.66; g.add(body);
  const belly=new THREE.Mesh(ballG,bellyM);
  belly.scale.set(.5,.42,.3); belly.position.set(0,.6,.55); g.add(belly);

  // head — deliberately oversized, that's where "cute" comes from
  const headPivot=new THREE.Group(); headPivot.position.set(0,1.28,.2); g.add(headPivot);
  const head=outlined(ballG,bodyM,1.1); head.scale.setScalar(.62); headPivot.add(head);
  const muzzle=new THREE.Mesh(ballG,bellyM);
  muzzle.scale.set(.3,.24,.22); muzzle.position.set(0,-.12,.55); headPivot.add(muzzle);
  const nose=new THREE.Mesh(ballG,pupilM); nose.scale.set(.09,.07,.07);
  nose.position.set(0,-.04,.72); headPivot.add(nose);

  const eyes=[];
  [-1,1].forEach(s=>{
    const w=new THREE.Mesh(eyeG,eyeWhiteM); w.scale.set(.17,.2,.14);
    w.position.set(s*.24,.1,.5); headPivot.add(w); eyes.push(w);
    const p=new THREE.Mesh(eyeG,pupilM); p.scale.set(.1,.12,.1);
    p.position.set(s*.25,.09,.6); headPivot.add(p);
    const sh=new THREE.Mesh(eyeG,shineM); sh.scale.setScalar(.04);
    sh.position.set(s*.28,.14,.66); headPivot.add(sh);
    const bl=new THREE.Mesh(eyeG,blushM); bl.scale.set(.12,.08,.06);
    bl.position.set(s*.42,-.1,.45); headPivot.add(bl);
  });

  if(L.ear==="round"){ [-1,1].forEach(s=>{
    const e=plain(ballG,accM); e.scale.set(.2,.22,.1);
    e.position.set(s*.42,.5,.05); headPivot.add(e); }); }
  if(L.ear==="horn"||L.horn){ [-1,1].forEach(s=>{
    const h=plain(new THREE.ConeGeometry(.12,.42,7),accM);
    h.position.set(s*.26,.62,0); h.rotation.z=-s*.25; headPivot.add(h); }); }
  if(L.ear==="tuft"){ [-1,1].forEach(s=>{
    const t=plain(new THREE.ConeGeometry(.16,.34,6),accM);
    t.position.set(s*.34,.6,.1); t.rotation.z=-s*.3; headPivot.add(t); }); }
  if(L.ear==="leaf"){ [-1,1].forEach(s=>{
    const l=plain(ballG,toon(0x6FCB55)); l.scale.set(.26,.1,.16);
    l.position.set(s*.34,.55,0); l.rotation.z=s*.5; headPivot.add(l); }); }
  if(L.mane){
    const mane=plain(new THREE.TorusGeometry(.62,.2,8,14),accM);
    mane.position.set(0,0,-.06); headPivot.add(mane);
  }
  if(L.wing){ [-1,1].forEach(s=>{
    const w=plain(ballG,accM); w.scale.set(.12,.34,.26);
    w.position.set(s*.76,.72,-.05); w.userData.flap=s; g.add(w); }); }

  if(L.tail==="tuft"){
    const t=plain(ballG,accM); t.scale.setScalar(.2);
    t.position.set(0,.7,-.82); g.add(t);
  } else if(L.tail==="spike"){
    const t=plain(new THREE.ConeGeometry(.24,.9,8),accM);
    t.position.set(0,.62,-.9); t.rotation.x=-Math.PI/2.1; g.add(t);
  } else if(L.tail==="fin"){
    const t=plain(ballG,accM); t.scale.set(.06,.34,.3);
    t.position.set(0,.78,-.85); g.add(t);
  }

  // stubby feet
  [-1,1].forEach(s=>{
    const f=plain(ballG,accM); f.scale.set(.19,.14,.24);
    f.position.set(s*.3,.16,.3); g.add(f);
    const b=plain(ballG,accM); b.scale.set(.19,.14,.24);
    b.position.set(s*.3,.16,-.32); g.add(b);
  });

  if(stage===4){
    const crown=plain(new THREE.CylinderGeometry(.3,.38,.24,8),toon(0xFFD24A));
    crown.position.set(0,.78,.05); headPivot.add(crown);
    for(let i=0;i<5;i++){
      const a=i/5*Math.PI*2;
      const sp=new THREE.Mesh(new THREE.ConeGeometry(.07,.16,6),toon(0xFFD24A));
      sp.position.set(Math.cos(a)*.3,.94,Math.sin(a)*.3+.05); headPivot.add(sp);
    }
  }
  g.userData.headPivot=headPivot; g.userData.eyes=eyes;
  return g;
}

// ── populate ──
const pets=[];
ROSTER.forEach(([name,exp,spec,days],i)=>{
  const st=stageIdx(exp), hunger=hungerOf(days);
  const grp=buildPet(spec,st);
  const scale=0.85+st*0.22; grp.scale.setScalar(scale);
  const a=(i/ROSTER.length)*Math.PI*2+((i*.7)%1);
  const r=5+((i*4.3)%11);
  grp.position.set(Math.cos(a)*r,0,Math.sin(a)*r);
  if(hunger.k==="hungry"||hunger.k==="starving"){
    grp.traverse(o=>{ if(o.isMesh&&o.material&&o.material.color&&o.material!==outlineMat){
      o.material=o.material.clone();
      o.material.color.lerp(new THREE.Color(0x9AA0A6),hunger.k==="starving"?.5:.28);
    }});
  }
  scene.add(grp);
  const tag=document.createElement('div');
  tag.className='tag'+(st===4?' legend':'')+(hunger.k==='starving'?' starving':'');
  tag.innerHTML=`<span class="tag-mood">${hunger.i}</span><span class="tag-name">${name}<span class="stage">${STAGES[st].zh}</span></span>`;
  document.getElementById('tags').appendChild(tag);
  pets.push({name,grp,tag,scale,st,
    speed:(hunger.k==='starving'||st===0)?0:.5+((i*13)%10)/22,
    phase:(i*1.3)%6.28, blink:Math.random()*4, target:new THREE.Vector3()});
});
function retarget(p){const a=Math.random()*Math.PI*2,r=3+Math.random()*14;
  p.target.set(Math.cos(a)*r,0,Math.sin(a)*r);}
pets.forEach(retarget);

// ── controls ──
let dragging=false,lastX=0;
document.getElementById('btn-rotate').onclick=e=>{autoRotate=!autoRotate;e.target.classList.toggle('active',autoRotate)};
canvas.addEventListener('pointerdown',e=>{dragging=true;lastX=e.clientX});
addEventListener('pointerup',()=>dragging=false);
addEventListener('pointermove',e=>{if(!dragging)return;
  camAngle-=(e.clientX-lastX)*.006;lastX=e.clientX;autoRotate=false;
  document.getElementById('btn-rotate').classList.remove('active')});
addEventListener('wheel',e=>{camDist=Math.max(14,Math.min(46,camDist+e.deltaY*.02))},{passive:true});

function resize(){renderer.setSize(innerWidth,innerHeight,false);
  camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix()}
addEventListener('resize',resize);
if(typeof ResizeObserver!=='undefined') new ResizeObserver(resize).observe(document.body);
resize();

const tmp=new THREE.Vector3(); let t=0;
function animate(){
  requestAnimationFrame(animate);
  const dt=.016; t+=dt;
  if(autoRotate) camAngle+=dt*.1;
  camera.position.set(Math.cos(camAngle)*camDist,camHeight,Math.sin(camAngle)*camDist);
  camera.lookAt(0,0,0);
  clouds.forEach((c,i)=>{c.position.x+=dt*(.3+i*.05); if(c.position.x>46)c.position.x=-46;});

  pets.forEach(p=>{
    const g=p.grp;
    if(p.speed>0){
      tmp.copy(p.target).sub(g.position); tmp.y=0;
      if(tmp.length()<.6) retarget(p);
      else{
        tmp.normalize();
        g.position.addScaledVector(tmp,p.speed*dt*2.4);
        g.rotation.y=Math.atan2(tmp.x,tmp.z);
        p.phase+=dt*7;
        const hop=Math.abs(Math.sin(p.phase));
        g.position.y=hop*.14*p.scale;
        // squash & stretch sells the bounce more than the height does
        g.scale.set(p.scale*(1+ (1-hop)*.06), p.scale*(1+hop*.08), p.scale*(1+(1-hop)*.06));
        if(g.userData.headPivot) g.userData.headPivot.rotation.x=Math.sin(p.phase)*.06;
      }
    } else {
      g.position.y=Math.sin(t*1.5+p.phase)*.04;
      g.scale.setScalar(p.scale*(1+Math.sin(t*1.5+p.phase)*.012));
    }
    // blink
    p.blink-=dt;
    const shut=p.blink<0&&p.blink>-.12;
    if(p.blink<-.12) p.blink=2+Math.random()*3;
    if(g.userData.eyes) g.userData.eyes.forEach(e=>e.scale.y=shut?.02:.2);
    g.traverse(o=>{ if(o.userData&&o.userData.flap)
      o.rotation.z=o.userData.flap*(.3+Math.sin(t*7+p.phase)*.3); });

    tmp.copy(g.position); tmp.y+=2.3*p.scale;
    tmp.project(camera);
    p.sx=(tmp.x*.5+.5)*innerWidth; p.sy=(-tmp.y*.5+.5)*innerHeight; p.sz=tmp.z;
  });

  // draw nearest-first, then hide any tag that would collide with one already placed
  const placed=[];
  [...pets].sort((a,b)=>a.sz-b.sz).forEach(p=>{
    if(p.sz>=1){ p.tag.style.opacity=0; return; }
    const w=p.tag.offsetWidth||90, h=p.tag.offsetHeight||34;
    const box={l:p.sx-w/2,r:p.sx+w/2,t:p.sy-h,b:p.sy};
    const hit=placed.some(q=>!(box.r<q.l||box.l>q.r||box.b<q.t||box.t>q.b));
    p.tag.style.opacity=hit?0:1;
    if(!hit){ placed.push(box);
      p.tag.style.left=p.sx+'px'; p.tag.style.top=p.sy+'px'; }
  });
  renderer.render(scene,camera);
}
animate();
</script>
</body>
</html>
