<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>神兽尺寸实验室 · Pet Size Lab</title>
<link rel="stylesheet" href="styles.css" />
<style>
  body { background: #FFF7E8; }
  .lab-banner {
    max-width: 760px; margin: 14px auto 0; padding: 12px 16px;
    background: #FFF3CE; border: 2px solid #E8C86A; border-radius: 14px;
    font-size: 14px; line-height: 1.6; color: #6B5A2E; text-align: center;
  }
  .lab-banner b { color: #8A5A12; }
</style>
</head>
<body>
<div class="lab-banner">
  🧪 <b>神兽尺寸实验室</b> —— 全部都是假资料，只是用来看六个阶段、19 种神兽的大小差别。
  <b>不会读也不会写你学校的真实资料</b>，跟正式 App 完全分开，看完可以直接关掉这个网址。
</div>
<div id="root"></div>

<script crossorigin src="https://unpkg.com/react@18.3.1/umd/react.production.min.js"></script>
<script crossorigin src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.production.min.js"></script>
<script src="app.bundle.js"></script>
<script>
(function () {
  // ── build a fake roster: one student per species, so all 19 mythic
  // beasts appear at once, with exp values spread across all six stages
  // (targets chosen to land a few students in each stage, including the
  // top end so the legend ring is visible) ──
  var targets = [0, 4, 8, 12, 20, 28, 35, 50, 65, 72, 80, 88, 92, 105, 115, 122, 130, 140, 150];
  var species = window.EcoData.PET_SPECIES;
  var now = Date.now();

  var members = species.map(function (sp, i) {
    return { id: "lab-" + sp.id, name: "示范" + sp.zh };
  });

  // Pin each member to their species explicitly (the same override a
  // teacher's 换宠物 writes) instead of relying on the hash assignment —
  // that guarantees exactly one of each of the 19, in a known order.
  var pets = {};
  members.forEach(function (m, i) {
    pets[m.id] = { speciesId: species[i].id };
  });

  var state = {
    teams: [
      { id: "lab", zh: "实验组", icon: "🧪", primary: "#4C8A7A", members: members },
    ],
    starLedger: members.map(function (m, i) {
      return targets[i] > 0
        ? [{ id: "lab-ev-" + i, studentId: m.id, stars: targets[i], ts: now - 3600000, kind: "recycle", note: "size-lab demo" }]
        : [];
    }).flat(),
    rewardRedemptions: [],
    pets: pets,
    settings: {},
  };

  var root = ReactDOM.createRoot(document.getElementById("root"));
  root.render(
    React.createElement(window.PetGardenView, {
      state: state,
      setState: function () {},   // read-only demo — nothing here can be saved
      authed: false,
    })
  );
})();
</script>
</body>
</html>
