<main>
<header><span class="eyebrow">ECO PETS / VOICE LIBRARY</span><span class="edition">6 款童声 · 第四轮</span></header>
<h1>每只神兽，都有自己的声音</h1>
<p class="intro">三款男孩声和三款女孩声。女孩声包含小芽、参考录音 A 与参考录音 B；每位学生的宠物仍说自己的专属对白。</p>
<div class="filters" role="group" aria-label="筛选童声"><button type="button" data-filter="" aria-pressed="true">全部 · 6</button><button type="button" data-filter="male" aria-pressed="false">男孩声 · 3</button><button type="button" data-filter="female" aria-pressed="false">女孩声 · 3</button></div>
<section id="cards" class="cards" aria-label="童声样板"></section>
<div class="controls"><label>示范造型<select id="stage"><option value="5">传奇形态</option><option value="1">幼生形态</option></select></label><button id="stop" type="button">停止播放</button><button id="mute" type="button" aria-pressed="false">静音：关</button></div>
<div class="note"><b>分配给不同学生</b>管理员打开学生的神兽图鉴，先设置男声／女声，再选“专属音色”。不同学生可以选不同款，也可以共用喜欢的音色。换宠物、进化后保留选择。<br>全部 19 位学生均有六个进化阶段的专属对白。</div>
<footer>小芽保留原音色；小云（A）、小星（B）来自你选中的两款录音声线。此页只播放示范音档，不读取或修改学生资料。一次只播放一款。</footer>
