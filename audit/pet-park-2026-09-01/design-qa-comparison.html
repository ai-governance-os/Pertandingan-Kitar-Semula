<!doctype html>
<html lang="zh-Hans">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>神兽乐园 · 视觉对照</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #07100d; color: #f7ecd0; font-family: system-ui, sans-serif; }
    header { height: 86px; display: flex; align-items: center; justify-content: space-between; padding: 0 28px; border-bottom: 1px solid rgba(238,217,162,.18); }
    h1 { margin: 0; font-size: 22px; }
    header p { margin: 5px 0 0; color: rgba(247,236,208,.62); font-size: 12px; }
    header em { padding: 7px 11px; border: 1px solid rgba(123,213,176,.28); border-radius: 999px; color: #9de3c8; font-size: 11px; font-style: normal; }
    main { display: grid; grid-template-columns: 1fr 1fr; gap: 18px; padding: 18px; }
    figure { margin: 0; min-width: 0; }
    figcaption { display: flex; align-items: baseline; justify-content: space-between; margin: 0 0 9px; }
    figcaption b { font-size: 14px; }
    figcaption span { color: rgba(247,236,208,.52); font-size: 11px; }
    .frame { position: relative; width: 100%; aspect-ratio: 1440 / 1024; overflow: hidden; border: 1px solid rgba(238,217,162,.28); border-radius: 14px; background: #0a1511; box-shadow: 0 18px 55px rgba(0,0,0,.28); }
    .frame img { display: block; width: 100%; height: 100%; object-fit: cover; object-position: center; }
    footer { margin: 0 18px 18px; padding: 13px 16px; border: 1px solid rgba(238,217,162,.16); border-radius: 12px; color: rgba(247,236,208,.72); background: rgba(255,255,255,.025); font-size: 12px; }
  </style>
</head>
<body>
  <header>
    <div><h1>天穹神殿 · 同屏视觉对照</h1><p>相同桌面画幅，对照构图、光线、层级、标签与移动端可读性</p></div>
    <em>最新反馈：当前全员蛋阶段 · 无龟系神兽</em>
  </header>
  <main>
    <figure>
      <figcaption><b>选定方向</b><span>电影级共享乐园</span></figcaption>
      <div class="frame"><img src="selected-sanctuary-reference.png" alt="选定的天穹神殿视觉方向" /></div>
    </figure>
    <figure>
      <figcaption><b>实验版实现</b><span>19 人 · 19 蛋 · 实际数据</span></figcaption>
      <div class="frame"><img src="cinematic-eggs-desktop.png" alt="神兽乐园实验版桌面截图" /></div>
    </figure>
  </main>
  <footer>对照说明：右侧依照当前 0 奖卡真实状态显示 19 枚蛋；成年神兽仅在点开详情后的六阶段预览出现。此差异来自用户最新反馈，不属于偏离。</footer>
</body>
</html>
