      <div style="font-size: 12px; font-weight: 700; color: #8A7C68; letter-spacing: .4px;">GOLDEN HOUR</div>

      <div style="width: 30px; height: 30px; border-radius: 9px; background: #4E4C86; border: 2px solid rgba(0,0,0,.08);"></div>
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #D98C86; border: 2px solid rgba(0,0,0,.08);"></div>
