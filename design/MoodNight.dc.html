<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=ZCOOL+KuaiLe&family=Nunito:wght@400;600;700;800&display=swap">
  <style>
    body { margin: 0; font-family: "Nunito", system-ui, sans-serif; }
    a { color: #9FC7FF; } a:hover { color: #C7DEFF; }
  </style>
</helmet>

<div style="width: 460px; height: 620px; background: #14162B; display: flex; flex-direction: column;">

  <div style="position: relative; height: 420px; overflow: hidden;">
    <div style="position: absolute; inset: 0; background: linear-gradient(180deg, #0E1030 0%, #1B2352 34%, #2F3F76 58%, #43608A 78%, #4E7288 100%);"></div>

    <!-- stars -->
    <div style="position: absolute; left: 46px; top: 40px; width: 3px; height: 3px; border-radius: 50%; background: #FFF; box-shadow: 0 0 8px 2px rgba(255,255,255,.9);"></div>
    <div style="position: absolute; left: 132px; top: 74px; width: 2px; height: 2px; border-radius: 50%; background: #E8F0FF; box-shadow: 0 0 6px 2px rgba(220,235,255,.8);"></div>
    <div style="position: absolute; left: 268px; top: 34px; width: 3px; height: 3px; border-radius: 50%; background: #FFF; box-shadow: 0 0 8px 2px rgba(255,255,255,.85);"></div>
    <div style="position: absolute; left: 356px; top: 88px; width: 2px; height: 2px; border-radius: 50%; background: #E8F0FF; box-shadow: 0 0 6px 2px rgba(220,235,255,.75);"></div>
    <div style="position: absolute; left: 412px; top: 46px; width: 3px; height: 3px; border-radius: 50%; background: #FFF; box-shadow: 0 0 8px 2px rgba(255,255,255,.8);"></div>
    <div style="position: absolute; left: 196px; top: 112px; width: 2px; height: 2px; border-radius: 50%; background: #FFF; box-shadow: 0 0 6px 2px rgba(255,255,255,.7);"></div>

    <!-- moon -->
    <div style="position: absolute; left: 350px; top: 84px; width: 200px; height: 200px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(200,225,255,.55) 0%, rgba(160,200,255,.18) 40%, rgba(160,200,255,0) 70%);"></div>
    <div style="position: absolute; left: 350px; top: 84px; width: 54px; height: 54px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle at 36% 32%, #FFFFFF, #DDE9FF 60%, #B9CDF0);"></div>

    <div style="position: absolute; left: -80px; top: 186px; width: 640px; height: 150px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; background: linear-gradient(180deg, #27305C, #33406B); filter: blur(2px);"></div>
    <div style="position: absolute; left: 150px; top: 206px; width: 500px; height: 140px; border-radius: 50% 50% 0 0 / 100% 100% 0 0; background: linear-gradient(180deg, #1E2A4E, #2A3A5C); filter: blur(1.5px);"></div>
    <div style="position: absolute; left: 0; top: 236px; width: 460px; height: 76px; background: linear-gradient(180deg, rgba(150,190,235,0), rgba(150,190,235,.28) 50%, rgba(150,190,235,0));"></div>

    <div style="position: absolute; left: -30px; top: 276px; width: 520px; height: 220px; border-radius: 46% 46% 0 0 / 24% 24% 0 0; background: linear-gradient(180deg, #24463F 0%, #1B3630 44%, #12241F 100%);"></div>

    <!-- glowing pond -->
    <div style="position: absolute; left: 24px; top: 328px; width: 178px; height: 74px; border-radius: 50%; background: radial-gradient(ellipse at 40% 30%, #9FE9F5 0%, #3FA7D0 45%, #1D5C8A 100%); box-shadow: 0 0 34px 10px rgba(110,210,240,.35), 0 0 0 6px rgba(30,60,60,.5);"></div>

    <div style="position: absolute; left: 296px; top: 178px; width: 180px; height: 206px;">
      <div style="position: absolute; left: 78px; top: 116px; width: 22px; height: 84px; border-radius: 10px; background: linear-gradient(90deg, #1B2620, #33443A 60%, #46594B);"></div>
      <div style="position: absolute; left: 6px; top: 8px; width: 166px; height: 132px; border-radius: 50%; background: radial-gradient(ellipse at 70% 24%, #3E6E63, #27504A 46%, #16302C); box-shadow: inset -12px -12px 26px rgba(4,12,10,.6);"></div>
      <div style="position: absolute; left: 92px; top: 14px; width: 74px; height: 60px; border-radius: 50%; background: radial-gradient(ellipse at 60% 30%, rgba(190,225,255,.4), rgba(190,225,255,0) 70%);"></div>
    </div>

    <!-- 星鹿 -->
    <div style="position: absolute; left: 138px; top: 244px; width: 190px; height: 190px;">
      <div style="position: absolute; left: 50%; top: 52%; width: 190px; height: 190px; transform: translate(-50%,-50%); border-radius: 50%; background: radial-gradient(circle, rgba(150,180,255,.36) 0%, rgba(150,180,255,0) 66%);"></div>
      <svg viewBox="0 0 200 200" width="190" height="190" style="position: relative;">
        <defs>
          <radialGradient id="deerBody" cx="32%" cy="24%" r="78%">
            <stop offset="0%" stop-color="#DCE6FF"/><stop offset="52%" stop-color="#93A9E8"/><stop offset="100%" stop-color="#4C5D9E"/>
          </radialGradient>
        </defs>
        <ellipse cx="100" cy="180" rx="52" ry="12" fill="rgba(6,12,24,.55)"/>
        <ellipse cx="100" cy="142" rx="40" ry="34" fill="url(#deerBody)"/>
        <circle cx="100" cy="92" r="37" fill="url(#deerBody)"/>
        <path d="M80 60l-14-28 7-3 14 21z" fill="#7C90D4"/><path d="M66 34l-18-7 3-7 18 7z" fill="#7C90D4"/>
        <path d="M120 60l14-28-7-3-14 21z" fill="#7C90D4"/><path d="M134 34l18-7-3-7-18 7z" fill="#7C90D4"/>
        <circle cx="48" cy="27" r="4" fill="#FFF6C4"/><circle cx="152" cy="27" r="4" fill="#FFF6C4"/><circle cx="100" cy="16" r="3" fill="#FFF6C4"/>
        <path d="M70 76a37 37 0 0 1 28-20" stroke="#F0F5FF" stroke-width="4.5" stroke-linecap="round" fill="none" opacity=".9"/>
        <ellipse cx="88" cy="92" rx="6" ry="7.5" fill="#1B2440"/><ellipse cx="112" cy="92" rx="6" ry="7.5" fill="#1B2440"/>
        <circle cx="90" cy="89" r="2.2" fill="#fff"/><circle cx="114" cy="89" r="2.2" fill="#fff"/>
        <ellipse cx="100" cy="106" rx="7" ry="5" fill="#6675AE"/>
      </svg>
    </div>

    <!-- fireflies -->
    <div style="position: absolute; left: 60px; top: 296px; width: 5px; height: 5px; border-radius: 50%; background: #FFF3B0; box-shadow: 0 0 14px 5px rgba(255,235,150,.85);"></div>
    <div style="position: absolute; left: 246px; top: 262px; width: 4px; height: 4px; border-radius: 50%; background: #FFF3B0; box-shadow: 0 0 12px 4px rgba(255,235,150,.8);"></div>
    <div style="position: absolute; left: 352px; top: 320px; width: 6px; height: 6px; border-radius: 50%; background: #FFF7C8; box-shadow: 0 0 16px 6px rgba(255,235,150,.85);"></div>
    <div style="position: absolute; left: 410px; top: 268px; width: 4px; height: 4px; border-radius: 50%; background: #FFF3B0; box-shadow: 0 0 12px 4px rgba(255,235,150,.75);"></div>
    <div style="position: absolute; left: 168px; top: 232px; width: 5px; height: 5px; border-radius: 50%; background: #FFF3B0; box-shadow: 0 0 14px 5px rgba(255,235,150,.7);"></div>

    <div style="position: absolute; left: -20px; top: 378px; width: 260px; height: 110px; border-radius: 50% 50% 0 0 / 70% 70% 0 0; background: linear-gradient(180deg, #10241F, #071310); filter: blur(6px);"></div>
    <div style="position: absolute; left: 330px; top: 388px; width: 220px; height: 100px; border-radius: 50% 50% 0 0 / 70% 70% 0 0; background: linear-gradient(180deg, #10241F, #071310); filter: blur(6px);"></div>
  </div>

  <div style="flex-grow: 1; display: flex; flex-direction: column; gap: 8px; padding: 20px 22px; background: #1A1D33;">
    <div style="display: flex; align-items: baseline; gap: 10px;">
      <div style="font-family: 'ZCOOL KuaiLe', 'Nunito', sans-serif; font-size: 25px; color: #F2F5FF;">星夜萤火</div>
      <div style="font-size: 12px; font-weight: 700; color: #8FA0C8; letter-spacing: .4px;">STARLIT NIGHT</div>
    </div>
    <div style="display: flex; gap: 6px;">
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #0E1030; border: 2px solid rgba(255,255,255,.12);"></div>
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #2F3F76; border: 2px solid rgba(255,255,255,.12);"></div>
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #3FA7D0; border: 2px solid rgba(255,255,255,.12);"></div>
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #93A9E8; border: 2px solid rgba(255,255,255,.12);"></div>
      <div style="width: 30px; height: 30px; border-radius: 9px; background: #FFF3B0; border: 2px solid rgba(255,255,255,.12);"></div>
    </div>
    <div style="font-size: 13.5px; line-height: 1.65; color: #C8D2EC;">神兽自己会发光，灵光颜色成为主角；萤火与发光池塘做点缀。最「梦幻」，也最容易一眼分辨每只神兽。</div>
    <div style="margin-top: auto; font-size: 12px; line-height: 1.6; color: #8FA0C8;"><b style="color:#9FE0A8;">优点</b> 灵光最抢眼、辨识度最高 · <b style="color:#F0A88A;">代价</b> 与 App 现有奶油色系差最远，等于换掉整体气质</div>
  </div>
</div>
</x-dc>
</body>
</html>
